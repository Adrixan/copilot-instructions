name: Validate Instructions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Markdown lint
        run: npx --yes markdownlint-cli . --config .markdownlint.json

      - name: Entry points in sync (run scripts/sync-entrypoints.sh to repair)
        run: |
          chmod +x scripts/*.sh
          ./scripts/check-sync.sh

      - name: Relative links resolve
        run: ./scripts/check-links.sh

      - name: Instruction frontmatter valid
        run: ./scripts/check-frontmatter.sh
